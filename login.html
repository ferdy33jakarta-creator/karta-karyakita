<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Karta RT 07</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeInSlide {
            from { 
                opacity: 0; 
                transform: translateY(40px) scale(0.95); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }
        .animate-card {
            animation: fadeInSlide 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute inset-0 bg-gradient-to-br from-blue-950 via-slate-900 to-indigo-950 z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
    </div>

<div id="loginCard" class="relative z-10 bg-slate-900/70 backdrop-blur-xl p-8 rounded-3xl border border-slate-700/60 w-full max-w-md shadow-2xl shadow-blue-950/50" style="opacity: 0; transform: translateY(40px);">
        
        <div class="text-center mb-6">
            <span class="inline-block bg-blue-600/20 text-blue-400 border border-blue-500/30 px-3 py-1 rounded-full text-xs font-semibold mb-2">
                ✨ Portal Pengurus Karya Kita
            </span>
            <h2 class="text-2xl font-extrabold text-white tracking-tight">Selamat Datang</h2>
            <p class="text-xs text-slate-400 mt-1">Silakan masuk untuk mengelola konten website Karang Taruna.</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Email Admin</label>
                <input type="email" id="emailInput" required placeholder="admin@rt07.com" 
                    class="w-full bg-slate-950/60 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Password</label>
                <input type="password" id="passwordInput" required placeholder="••••••••" 
                    class="w-full bg-slate-950/60 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
            </div>
            
            <button type="submit" id="submitBtn"
                class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white font-semibold py-3 rounded-xl text-sm transition-all shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2">
                <span id="btnText">Masuk ke Dashboard</span>
            </button>
        </form>

        <div id="wrapperEmergencyLogout" class="mt-3 hidden">
            <button id="btnEmergencyLogout" 
                class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 font-medium py-2 rounded-xl text-xs transition-all flex items-center justify-center gap-1.5">
                <span>⚠️ Akun Nyangkut? Paksa Logout di Sini</span>
            </button>
        </div>

        <p id="errorLogin" class="text-red-400 text-xs mt-4 text-center hidden bg-red-500/10 border border-red-500/20 p-3 rounded-xl animate-pulse"></p>
        
        <div class="mt-6 text-center pt-4 border-t border-slate-800">
            <a href="index.html" class="text-xs text-slate-400 hover:text-white transition-colors inline-flex items-center gap-1">
                <span>← Kembali ke Beranda Website</span>
            </a>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
